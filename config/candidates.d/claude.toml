# Claude Opus label arm (label-v2). runtime = "external" (shoebox/runners/external.py): no API call is made
# from shoebox. Claude Code subagents read the packets written by `shoebox label packets --provider claude`
# (1024px thumbnails of the derived infer-v1 image, keyed k-0001..; map.json keeps key -> asset_id), caption
# each photo with prompt label-v2.md, and write labels-*.jsonl; `shoebox label ingest --candidate opus-v2`
# validates them against label-v2.json and stores them like any other runner's records, so `label_index`,
# `embed run --caption-from`, `search-run` and the caption audit read them unchanged.
# `producer` is hashed and stored as each record's `runtime`: change it if how the labels are made changes.

[candidates.opus-v2]
runtime = "external"
model = "claude-opus-5.5"
model_id = "claude/opus-5.5"
producer = "Claude Code subagent, 1024px thumbnail of the infer-v1 image"
prompt = "label-v2.md"
schema = "label-v2.json"
profile = "infer-v1"

# The same label arm through the Anthropic Message Batches API (runtime `anthropic-batch`,
# runners/anthropic_batch.py): opus-v2's prompt, schema and 1024px thumbnail, sent by shoebox itself, so it
# is a distinct store key. Spend counts against the Anthropic budget ($100 of the owner's API credits,
# 2026-10-13; privacy.DEFAULT_PROVIDER_USD), never the Gemini project budget. Prices: Opus 5.5 standard
# $4 in / $20 out per MTok, batch half price (platform.claude.com pricing, checked 2026-10-13). Anthropic
# publishes no end date: price_valid_until is a review date, not a known price change.
# Image tokens: ceil(w/28)*ceil(h/28), at most 37*37 = 1369 for a 1024px thumbnail.
# prompt_placement = "system-cached" (hashed: the layout differs from the 5-request smoke run, so it has its
# own store key): label-v2.md goes in a system block with cache_control {ephemeral, ttl 1h}, the user turn is
# the image then "Label this photo.". Cache multipliers on the base input price (platform.claude.com pricing,
# prompt caching, checked 2026-10-13): 5m write 1.25x, 1h write 2x, read 0.05x; the batch discount applies on
# top. Budget and run-cap estimates assume every request pays the 1h write (worst case).
[candidates.opus-api-v2]
runtime = "anthropic-batch"
model = "claude-opus-5-5"
model_id = "anthropic/claude-opus-5-5"
prompt = "label-v2.md"
schema = "label-v2.json"
profile = "infer-v1"
max_tokens = 2048
budget_provider = "anthropic"
prompt_placement = "system-cached"
max_usd_per_run = 10.0
est_image_tokens = 1400
est_prompt_tokens = 3300          # label-v2.md plus the structured-output schema: the 2026-10-13 smoke
                                  # billed ~4,600 input tokens per photo, ~1,300 of them the image
est_cached_prompt_tokens = 2100   # the part of est_prompt_tokens in the cached system block (label-v2.md);
                                  # the ~1,200 schema tokens are outside it and billed at base every request.
                                  # Used only by the expected ("assuming hits") quote.
est_output_tokens = 400
est_thinking_tokens = 0           # no extended thinking requested
price_input_usd_per_mtok = 4.0
price_output_usd_per_mtok = 20.0
price_batch_discount = 0.5
price_cache_write_5m_multiplier = 1.25
price_cache_write_1h_multiplier = 2.0
price_cache_read_multiplier = 0.05
price_date = "2026-10-13"
price_valid_until = "2027-01-13"

# Sonnet 5.5 through the same runner and layout, tried as a cheaper bulk captioner (owner, 2026-10-13); it must pass

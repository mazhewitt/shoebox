# Label candidates. Each [candidates.<name>] is resolved by shoebox.runners.resolve();
# everything that affects output goes into params_hash (docs/pilot.md section 4).
# Extra candidates live in config/candidates.d/*.toml and are merged in (a name may not repeat).
# quant is what `ollama show <model>` reported on 2026-10-10 (Ollama 0.40.2).

[candidates.rules-v1]
runtime = "rules"
model = "rules-v1"
schema = "label-v1.json"  # hashed, and the rule output is validated against it
profile = "infer-v1"

[candidates.e4b-bf16]
runtime = "ollama"
model = "gemma4:e4b-mlx-bf16"
quant = "bf16"            # safetensors via the MLX runner; `ollama show` leaves quantization_level empty
prompt = "label-v1.md"
schema = "label-v1.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024        # caps runaway output; a label is ~100-150 tokens
image_budget = "auto"     # Ollama has no budget control (design D6)
# A first attempt that hits num_predict (a repetition loop) is stored as invalid/truncated and retried once
# with these overrides under its own params_hash; evals read the retry (spec label-runners).
retry = { num_predict = 300, repeat_penalty = 1.1 }

[candidates.e4b-q4]
runtime = "ollama"
model = "gemma4:e4b"
quant = "Q4_K_M"
prompt = "label-v1.md"
schema = "label-v1.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024
image_budget = "auto"
retry = { num_predict = 300, repeat_penalty = 1.1 }

[candidates.g12b-q4]
runtime = "ollama"
model = "gemma4:12b"
quant = "Q4_K_M"
prompt = "label-v1.md"
schema = "label-v1.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024
image_budget = "auto"
retry = { num_predict = 300, repeat_penalty = 1.1 }

[candidates.g31b]
runtime = "ollama"
model = "gemma4:31b"
quant = "Q4_K_M"
prompt = "label-v1.md"
schema = "label-v1.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024
image_budget = "auto"
retry = { num_predict = 300, repeat_penalty = 1.1 }

# label-v2 arms (design D7): search-oriented caption, 5-20 tags, rotate_cw. A v2 label is ~200-250 tokens,
# so the truncation retry cap is 450 rather than v1's 300.
[candidates.e4b-bf16-v2]
runtime = "ollama"
model = "gemma4:e4b-mlx-bf16"
quant = "bf16"
prompt = "label-v2.md"
schema = "label-v2.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024
image_budget = "auto"
retry = { num_predict = 450, repeat_penalty = 1.1 }

[candidates.g12b-q4-v2]
runtime = "ollama"
model = "gemma4:12b"
quant = "Q4_K_M"
prompt = "label-v2.md"
schema = "label-v2.json"
profile = "infer-v1"
think = false
temperature = 0.0
seed = 0
num_ctx = 8192
num_predict = 1024
image_budget = "auto"
retry = { num_predict = 450, repeat_penalty = 1.1 }
# Tiny-image rule (task 9.2, evals/runs/2026-10-11_tiny-images.md): an image whose source long side is under
# 256 px goes to the hosted candidate when its capture is hosted-eligible; otherwise 12B captions it and the
# record is marked `tiny`. Not hashed (routing and marking, not the model's output).
tiny_max_side = 256
tiny_action = "route_hosted_else_mark"

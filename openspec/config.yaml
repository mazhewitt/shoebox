schema: spec-driven

# Project context: constraints that guide every artifact. Background and
# rationale live in handoff.md (original brief) and PLAN.md (agreed plan).
context: |
  Shoebox: self-hosted, searchable catalogue of the owner's personal photos
  (2002–present). Sources:
  - Google Photos: two libraries (owner on Android, Jude on iPhone), via
    Takeout.
  - The NAS share ImportantFiles (~605 GB, synced with Google Drive): film
    scans, Nikon/Leica raws, JPEGs, PSDs, an old Drive "Google Photos" tree,
    and Lightroom catalogues.
  - The other NAS photo shares (Home Folders, Backup, Volume2): family
    members' folders and old PC/phone backups. All of these are in scope;
    cross-source duplicates are grouped by hash, never deleted, and cleaned
    up later from a dedup report.
  Every source names its person. Hosted processing needs that person's
  consent, which defaults to no for everyone but the owner.
  MVP: sort (catalogue views only), catalogue and describe every photo for
  search. Faces come next.

  Hard constraints
  - Open-source code and models. No proprietary component may lock the archive
    into a format or service.
  - Hosted models are allowed only as owner-approved exceptions. Today that
    means Gemini on the owner's individual paid Gemini API account, and
    Claude (Opus 5.5 via Claude Code) since 2026-10-11:
    - Uses: Gemini for eval reference captions, relevance judging, an eval
      candidate, and the bulk pass only if it wins the eval. Claude for
      writing eval queries and auditing references and judgments.
    - Consent is per library: the owner's library may be sent, including
      photos of family and friends (owner, 2026-10-11).
    - Terms: the paid-tier no-training terms apply, and the 55-day abuse log
      is accepted.
    - Inputs: derived images only, with metadata stripped.
    - Never face recognition/identification, the never-send list, ID/medical
      documents, or a library whose owner hasn't consented.
    - The privacy checklist must be confirmed before each run.
    - Every run has a spend cap; hosted inference budget is USD 150.
    Everything else stays local.
  - Originals are immutable, and synced sources are never written. Nothing
    writes to originals/ or to the Drive-synced ImportantFiles share; it is
    read through a read-only NAS user and a read-only mount. Metadata fixes
    (incl. Takeout sidecars) live in the DB with per-field provenance.
  - Evals before scale. No labelling stage runs over the full archive until
    it passes a gate scored on a frozen ground-truth test split, with
    thresholds fixed in evals/gates.toml before the run.
    - Report per stratum (era, capture medium x digitiser, colour/mono), not
      just overall.
    - Gates are precision-first; uncertain outputs become unknown, with the
      score kept.
  - Search is an HTTP API; web UI now and phone app later are thin clients.

  Languages
  - Python (uv) for scripts and pipelines: every batch stage (inventory, derive,
    dedup, screen, embed, label runs), model runners and evals. Batch CLIs and
    supervised runners only (JSONL over stdin/stdout); no Python daemons or
    services.
  - Rust only for complex logic, long-running services, or speed/concurrency
    requirements: the search API including ranking (shoebox-api, Axum) and any
    shared core it needs.
  - TypeScript for the web UI and for thin Vally eval plugins (executor and
    graders, pinned Vally version, telemetry off). Metrics and gates stay in
    Python.

  Machines and data rules
  - Synology NAS: storage only. Shares:
    - ImportantFiles: source, read-only to Shoebox;
    - shoebox: staging/, originals/takeout/, derived/, results/, frame/.
    Backed up to GCS, except derived/ and staging/.
  - Model work runs on the M5 Max laptop (128 GB) for now. The M5 Ultra Mac
    Studio (from late Oct 2026) becomes the host:
    - API and SQLite on its SSD;
    - runs natively under launchd, with Docker only on the NAS if needed.
    The M1 Studio is busy with radiobox and is not used.
  - No always-on worker. Incremental work is a `shoebox ingest` batch run on
    the same code path as bulk; it runs only the stages and model_ids an asset
    is missing.
  - SQLite is opened only on the host's local disk, never over SMB/NFS.
    shoebox-api is the single writer. Model outputs land as result bundles in
    results/, keyed by (asset_id, model_id, params_hash).
  - Assets are keyed by BLAKE3 of the original bytes. Every model output
    carries model_id + params_hash; a model change means a new model_id,
    a re-eval, and an explicit backfill, never silent mixing.
  - Never delete source media; duplicates are grouped with a canonical member.
  - Auth: trust only the Cloudflare Access JWT, verified against the team JWKS.

  Human labels (face names, eval ground truth) are the most irreplaceable data;
  any design that stores them must cover their backup. Every label records its
  provenance (who, how, any pre-label model).

  Background: handoff.md, handoff-supplement.md, PLAN.md (partly superseded),
  research/, docs/machines.md.


[project]
name = "shoebox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mazhewitt", email = "mazda@aduki.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.11",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "psd-tools>=1.24.0",
    "pyvips[binary]>=3.2.0",
    "rawpy>=0.27.1",
]

[project.scripts]
shoebox = "shoebox:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
